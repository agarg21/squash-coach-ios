name: SquashCoach
options:
  bundleIdPrefix: com.agarg21
  deploymentTarget:
    iOS: "17.0"
packages:
  DrillCore:
    path: .
targets:
  SquashCoach:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: DrillCore
        product: DrillCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Squash Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: The camera watches your swing and measures it on this phone. Video is saved only when debug recording is on.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agarg21.squashcoach
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SquashCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SquashCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agarg21.squashcoach.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SquashCoach:
    build:
      targets:
        SquashCoach: all
        SquashCoachUITests: [test]
    test:
      targets: [SquashCoachUITests]
