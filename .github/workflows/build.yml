name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core logic tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app:
    name: Build the app (no signing)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project SquashCoach.xcodeproj -scheme SquashCoach -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error|warning: unused|BUILD|\*\*" | tail -80

  ui:
    name: Screen tests in the simulator
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Walk through a set in an iPhone simulator (demo mode)
        run: |
          set -o pipefail
          UDID=$(python3 ci/pick_sim.py)
          # start the simulator first and wait until it is fully up: a cold one can time out launching the app
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test -project SquashCoach.xcodeproj -scheme SquashCoach -destination "id=$UDID" -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -retry-tests-on-failure -test-iterations 2 CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error|Test Case|Test Suite|TEST|\*\*|failed|XCTAssert" | tail -80
      - name: Collect the screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path shots || true
          ls -la shots | head -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Publish the screenshots to the ci-screenshots branch
        if: always()
        run: |
          cd shots && git init -q -b ci-screenshots . && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots from run $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

  testflight:
    name: Sign and send to TestFlight
    needs: [core, app, ui]
    # runs only once the repository variable TESTFLIGHT is set to "on" (after the Apple secrets below have been added)
    if: github.ref == 'refs/heads/main' && vars.TESTFLIGHT == 'on'
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Write the App Store Connect key
        run: mkdir -p "$RUNNER_TEMP/keys" && printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project SquashCoach.xcodeproj -scheme SquashCoach -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SquashCoach.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive 2>&1 | grep -E "error|ARCHIVE|\*\*" | tail -60
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SquashCoach.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | grep -E "error|EXPORT|Upload|\*\*" | tail -40
